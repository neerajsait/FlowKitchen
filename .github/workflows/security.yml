name: Security Audit

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Weekly dependency audit every Monday 03:00 UTC
    - cron: "0 3 * * 1"

jobs:
  pip-audit:
    name: Python dependencies (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit backend requirements
        run: pip-audit -r backend/requirements.txt --strict --desc on

      - name: Audit dev requirements
        run: pip-audit -r backend/requirements-dev.txt --strict --desc on

  npm-audit-admin:
    name: Admin frontend (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --prefix frontend-admin

      - name: Audit (fail on high/critical)
        run: npm audit --audit-level=high --prefix frontend-admin

  npm-audit-customer:
    name: Customer frontend (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --prefix frontend-customer

      - name: Audit (fail on high/critical)
        run: npm audit --audit-level=high --prefix frontend-customer
