version: '3.8'

services:
  backend:
    build: ./backend
    container_name: food_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DB}
      - FRONTEND_URL=http://localhost:3000,http://localhost:3001
      - ALLOW_SEED=0 # Disabled in production
    depends_on:
      - db
      - redis
    volumes:
      - backend_data:/app/instance
      - backend_uploads:/app/static/uploads

  frontend-customer:
    build: ./frontend-customer
    container_name: food_customer
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

  frontend-admin:
    build: ./frontend-admin
    container_name: food_admin
    restart: always
    ports:
      - "3001:80"
    depends_on:
      - backend

  redis:
    image: redis:alpine
    container_name: food_redis
    restart: always
    ports:
      - "6379:6379"

  db:
    image: mysql:8.0
    container_name: food_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  backend_data:
  backend_uploads:
  mysql_data:
